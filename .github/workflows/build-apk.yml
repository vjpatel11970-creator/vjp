name: Build Student + Teacher APK

on:
  push:
    paths:
      - 'student-app/**'
      - 'teacher-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build student APK
        working-directory: student-app
        run: gradle assembleRelease --no-daemon

      - name: Build teacher APK
        working-directory: teacher-app
        run: gradle assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp student-app/app/build/outputs/apk/release/app-release.apk vidyarthi-app.apk
          cp teacher-app/app/build/outputs/apk/release/app-release.apk shikshak-app.apk

      - name: Keep copies as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: |
            vidyarthi-app.apk
            shikshak-app.apk

      - name: Publish release (direct download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" vidyarthi-app.apk shikshak-app.apk \
            --title "School Apps v${{ github.run_number }}" \
            --notes "Student app: vidyarthi-app.apk | Teacher app: shikshak-app.apk" \
            --latest
