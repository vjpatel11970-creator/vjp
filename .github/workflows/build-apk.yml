name: Build Student APK

on:
  push:
    paths:
      - 'student-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: student-app
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp student-app/app/build/outputs/apk/release/app-release.apk vidyarthi-app.apk

      - name: Keep a copy as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidyarthi-app
          path: vidyarthi-app.apk

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" vidyarthi-app.apk \
            --title "Vidyarthi App v${{ github.run_number }}" \
            --notes "Student portal Android app. Download vidyarthi-app.apk and install." \
            --latest
